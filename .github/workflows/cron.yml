name: Build and Release by Cron

on:
  schedule:
    - cron: "0 0 * * 1" # Run every Monday at 00:00 UTC
  workflow_dispatch:
    
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AppImage
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required permission to push commits, create tags, and publish releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Push to Source
        id: sync
        run: |
          git config --global user.name "cron"
          git config --global user.email "noreply@github.com"
          bash ./update.sh
          git add flake.nix version.txt
          if git diff-index --quiet HEAD; then
            echo "No changes to commit." >> "$GITHUB_STEP_SUMMARY"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git add latest.txt
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
          git commit -m "Sync files from source repository"
          git push
          echo "Sync to Source succeeded" >> "$GITHUB_STEP_SUMMARY"

      - name: Magic Nix Cache
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build AppImage
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ ! -f "version.txt" ]; then
            echo "Error: version.txt not found!" >&2
            exit 1
          fi
          APP_VERSION="$(tr -d '[:space:]' < version.txt)"

          # Use the exact Git tag pushed by the user; fallback to version-branch on manual workflow_dispatch
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            # Extract the first 7 characters of the current commit SHA
            SHORT_SHA="${GITHUB_SHA::7}"
            RELEASE_TAG="c${APP_VERSION}-${SHORT_SHA}"
          fi

          echo "APP Version: ${APP_VERSION}"
          echo "Release Tag: ${RELEASE_TAG}"

          # Allow unfree packages and build the flake output
          NIXPKGS_ALLOW_UNFREE=1 nix build .#appimage

          # Target asset names using the exact tag
          OUTPUT_APPIMAGE="WeMeet-${APP_VERSION}-${RELEASE_TAG}-x86_64.AppImage"
          OUTPUT_ZSYNC="${OUTPUT_APPIMAGE}.zsync"

          # Extract artifacts from the result directory
          SRC_APPIMAGE="$(find -L result -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          SRC_ZSYNC="$(find -L result -maxdepth 1 -type f -name '*.zsync' | head -n 1)"

          if [ -z "$SRC_APPIMAGE" ]; then
            echo "Error: Built .AppImage not found in result/" >&2
            exit 1
          fi

          cp -L "$SRC_APPIMAGE" "${OUTPUT_APPIMAGE}"
          chmod +x "${OUTPUT_APPIMAGE}"

          # Re-index zsync for the final filename if zsyncmake is available, otherwise copy directly
          if [ -n "$SRC_ZSYNC" ]; then
            if command -v zsyncmake &>/dev/null; then
              zsyncmake -u "${OUTPUT_APPIMAGE}" -o "${OUTPUT_ZSYNC}" "${OUTPUT_APPIMAGE}"
            else
              cp -L "$SRC_ZSYNC" "${OUTPUT_ZSYNC}"
            fi
          fi

          # Inspect generated assets
          ls -lh "${OUTPUT_APPIMAGE}" "${OUTPUT_ZSYNC}"

          # Export environment variables for the downstream release step
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "APPIMAGE_ASSET=${OUTPUT_APPIMAGE}" >> "$GITHUB_ENV"
          echo "ZSYNC_ASSET=${OUTPUT_ZSYNC}" >> "$GITHUB_ENV"

      - name: Create Release and Upload Asset
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "WeMeet c${{ env.APP_VERSION }} (${{ env.RELEASE_TAG }})"
          files: |
            ${{ env.APPIMAGE_ASSET }}
            ${{ env.ZSYNC_ASSET }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
